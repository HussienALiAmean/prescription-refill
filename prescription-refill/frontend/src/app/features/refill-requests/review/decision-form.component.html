<form class="decision-form" (submit)="$event.preventDefault()" aria-labelledby="decision-heading">
  <h2 id="decision-heading">{{ t().decision.heading }}</h2>

  <label for="decision-note">{{ t().decision.noteLabel }}</label>
  <p id="decision-note-hint" class="hint">{{ t().decision.noteHint }}</p>
  <!-- dir="auto": the note is sent and shown exactly as typed, in its own direction (spec 005 FR-004, FR-015). -->
  <textarea
    id="decision-note"
    rows="4"
    dir="auto"
    [value]="note()"
    (input)="onInput($event)"
    [attr.aria-invalid]="errors().length > 0 ? 'true' : null"
    [attr.aria-describedby]="errors().length > 0 ? 'decision-note-hint decision-note-error' : 'decision-note-hint'"
  ></textarea>
  <div class="field-meta">
    @if (errors().length > 0) {
      <p id="decision-note-error" class="field-error" role="alert">
        <app-icon name="alert-octagon" [size]="16" />
        <span>{{ errors().join(' ') }}</span>
      </p>
    }
    <span class="counter tabular" [class.is-over]="noteLength() > noteLimit">
      {{ noteLength() }} / {{ noteLimit }}<span class="visually-hidden"> {{ t().decision.charactersSuffix }}</span>
    </span>
  </div>

  @if (!canApprove()) {
    <p id="approve-unavailable" class="unavailable">
      <app-icon name="lock" [size]="16" />
      <span>{{ t().decision.approveUnavailable }}</span>
    </p>
  }

  <div class="actions">
    <button
      type="button"
      class="btn btn-primary"
      [disabled]="!canApprove() || submitting()"
      [attr.aria-describedby]="canApprove() ? null : 'approve-unavailable'"
      (click)="approve.emit()"
    >
      @if (pending() === 'approve') {
        <span class="spinner" aria-hidden="true"></span>
        {{ t().decision.approving }}
      } @else {
        <app-icon name="check-circle" [size]="16" />
        {{ t().decision.approve }}
      }
    </button>
    <button type="button" class="btn btn-danger" [disabled]="submitting()" (click)="deny.emit()">
      @if (pending() === 'deny') {
        <span class="spinner" aria-hidden="true"></span>
        {{ t().decision.denying }}
      } @else {
        <app-icon name="x-circle" [size]="16" />
        {{ t().decision.deny }}
      }
    </button>
  </div>
</form>
