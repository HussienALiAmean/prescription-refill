<!-- Decorative ambient light on the dark canvas (004 research R4): no pointer events, hidden from
     assistive technology, hidden in forced colors and print. -->
<div class="ambient-layer" aria-hidden="true"></div>

<header class="app-header on-canvas">
  <div class="container app-header-inner">
    <a class="brand" routerLink="/requests">
      <span class="brand-mark"><app-icon name="pill" [size]="18" /></span>
      <span class="brand-text">
        <span class="brand-name">{{ t().app.brandName }}</span>
        <span class="brand-tagline">{{ t().app.brandTagline }}</span>
      </span>
    </a>
    <div class="header-tools">
      <app-connection-indicator />
      <!-- Language and theme (spec 005 FR-008, FR-026): independent, on every screen. -->
      <div class="preferences" role="group" [attr.aria-label]="t().app.preferences">
        <app-preference-switch
          name="language"
          testId="language-switch"
          [legend]="t().app.language"
          [options]="languageOptions"
          [value]="i18n.language()"
          (changed)="setLanguage($event)"
        />
        <app-preference-switch
          name="theme"
          testId="theme-switch"
          [legend]="t().app.theme"
          [options]="themeOptions()"
          [value]="themes.theme()"
          (changed)="setTheme($event)"
        />
      </div>
      <p class="visually-hidden" aria-live="polite" data-testid="preference-announcement">{{ announcement() }}</p>
    </div>
  </div>
</header>

<p class="demo-notice on-canvas" role="note">
  <span class="container demo-notice-inner">
    <app-icon name="info" [size]="16" />
    <span>{{ t().app.demoNotice }}</span>
  </span>
</p>

<main class="container sheet app-main">
  <router-outlet />
</main>
